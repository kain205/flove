project_id = "flove"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "flove://auth/callback"
additional_redirect_urls = [
  "flove://auth/callback",
  "flove://auth/reset-password",
  "https://flove.app/auth/callback",
  "https://flove.app/auth/reset-password",
  "https://flove-app.vercel.app/auth/callback",
  "https://flove-app.vercel.app/auth/reset-password",
  "https://f-connect-rho.vercel.app/auth/callback",
  "https://f-connect-rho.vercel.app/auth/reset-password"
]

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created_require_fpt"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 8
max_frequency = "60s"

[storage]
enabled = true

[functions.generate-daily-matches]
verify_jwt = true

[functions.ensure-daily-matches]
verify_jwt = true

[functions.analyze-onboarding-profile]
verify_jwt = true

[functions.confirm-onboarding-profile]
verify_jwt = true

[functions.submit-match-feedback]
verify_jwt = true

[functions.accept-curated-match]
verify_jwt = true

[functions.send-preference-chat-message]
verify_jwt = true

[functions.find-blind-date-partner]
verify_jwt = true

[functions.request-reveal]
verify_jwt = true

# Queue consumers authenticate with a dedicated worker secret inside the
# function. They are never callable with an end-user JWT.
[functions.process-ai-jobs]
verify_jwt = false
