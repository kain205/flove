name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      # Public, non-routable test values used only to compile the unauthenticated web smoke path.
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: e2e-public-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm test
      - run: npm --workspace @flove/app run typecheck
      - run: npm --workspace @flove/app run lint
      - run: npm run build:packages
      - run: npm run build:app:web
      - run: npm run supabase:functions:check
      - run: npm run supabase:functions:bundle
      - run: npm run supabase:functions:test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
        env:
          E2E_USE_EXISTING_BUILD: "1"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - run: supabase db lint
